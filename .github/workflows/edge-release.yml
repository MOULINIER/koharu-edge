name: Edge Release

# Koharu Edge releases, started by hand from the Actions tab ("Run workflow").
# Upstream's release.yml publishes as upstream (WinGet, SignPath, Apple notarization,
# Sentry), so the fork tags and builds its own: `vX.Y.Z-edge.N`, where X.Y.Z is the
# upstream workspace version and N counts Edge releases on it. The version comes from
# the tag at build time, so the fork never edits the workspace version and upstream
# version bumps merge cleanly.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: edge-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Create the next edge tag
        id: next
        run: |
          if git tag --points-at HEAD | grep -q -- '-edge\.'; then
            echo "::error::main is already released as $(git tag --points-at HEAD | grep -- '-edge\.')"
            exit 1
          fi
          version=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          last=$(git tag --list "v$version-edge.*" | sed "s/^v$version-edge\.//" | sort -n | tail -1)
          tag="v$version-edge.$(( ${last:-0} + 1 ))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Koharu Edge $tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ad-hoc signed: unsigned Apple Silicon apps are reported as damaged.
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin --config ''{"bundle":{"macOS":{"signingIdentity":"-"}}}'''
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'ubuntu-24.04-arm'
            args: ''
          # MSI rejects non-numeric pre-release versions such as `-edge.1`.
          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-edge-${{ matrix.platform }}

      - name: Install macOS CEF helper targets
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install --no-install-recommends \
            libgtk-4-dev \
            build-essential \
            llvm \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ matrix.platform }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Release metadata
        id: meta
        shell: bash
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          base="${TAG#v}"
          base="${base%%-edge.*}"
          previous=$(git describe --tags --abbrev=0 --match 'v*-edge.*' "$TAG^" 2>/dev/null || true)
          {
            echo 'body<<EOF'
            echo "Koharu Edge, based on upstream Koharu v$base."
            echo "See [how this fork differs](https://github.com/${GITHUB_REPOSITORY}#how-this-fork-differs)."
            echo
            if [ -n "$previous" ]; then
              echo "## Changes since $previous"
              git log --first-parent --format='- %s' "$previous..$TAG"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ needs.tag.outputs.tag }}
          releaseName: Koharu Edge ${{ needs.tag.outputs.tag }}
          releaseBody: ${{ steps.meta.outputs.body }}
          releaseDraft: false
          prerelease: false
          # The fork has no SignPath account, so upstream's Windows sign command is removed.
          args: >-
            ${{ matrix.args }}
            --config '{"version":"${{ steps.meta.outputs.version }}","bundle":{"windows":{"signCommand":null}}}'
